<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BestellApp</title>
    <link
      rel="shortcut icon"
      href="./assets/icons/Logo.png"
      type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="./styles/basket.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/standard.css" />
    <link rel="stylesheet" href="./styles/mediaquery.css" />
    <script src="script.js"></script>
    <script src="./scripts/db.js"></script>
    <script src="./scripts/templates.js"></script>
  </head>
  <body onload="init()">
    <header>
      <div class="topnav">
        <img src="./assets/icons/Logo 02.png" alt="" class="active" />
        <img src="./assets/icons/dehaze.png" alt="" class="img_menu" />
      </div>
    </header>
    <section class="landing_section">
      <div class="landing-bg">
        <img src="./assets/icons/logo.png" alt="burger-logo" />
      </div>
      <div class="headline">
        <div class="text">
          <img src="./assets/icons/BurgerHouse.png" alt="" />
          <img src="./assets/imgs/Frame 28.png" alt="" />
        </div>
        <p>The best of Burgers, Pizza, and Greens, all in one great place.</p>
      </div>
    </section>
    <div class="content_wrapper">
      <section class="menu_section" id="main_content"></section>
      <!--  width: 100% - 300px = 2 Sections side by Side, bigger section sizable, takes rest if space from other sections width-->
      <section class="basket_frame" id="main_basket"></section>
      <!-- width: 300px , div inside width 100%, height flexible (as we need it), position sticky, top: 0-->
    </div>
    <dialog
      id="confirmation"
      onclick="closeConfirmation()"
      onload="closeConfirmation()">
      <div id="conf_content"></div>
    </dialog>
    <footer class="footer_content">
      <div class="copyright">
        <img src="./assets/icons/copyright.png" alt="" />
        <p>2025 BurgerHouse</p>
      </div>
      <p>Imprint</p>
      <p>Cookie Preferences</p>
    </footer>

    <div class="menubar">
      <div id="respo_basket" class="responsive_basket d_none"></div>
      <div class="navbar">
        <button><img src="./assets/icons/home.png" alt="" /></button>
        <button><img src="./assets/icons/person.png" alt="" /></button>
        <button>
          <img src="./assets/icons/takeout_dining_2.png" alt="" />
        </button>
        <button onclick="renderResponsiveBasket()">
          <img src="./assets/icons/shopping_cart (1).png" alt="" />
        </button>
      </div>
    </div>
  </body>
</html>
